<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto News Pulse</title>
<style>
  :root {
    --bg: #0d1016; --panel: #151a23; --panel2: #1b2130; --line: #262e3f;
    --text: #e6e9ef; --muted: #8a93a6; --long: #22c55e; --short: #ef4444; --neutral: #94a3b8; --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--long); margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .mood { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
  .mood b { font-size: 13px; }
  .bar { height: 10px; border-radius: 6px; overflow: hidden; display: flex; background: var(--line); }
  .bar i { display: block; height: 100%; }
  .mood .legend { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .5px; padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .LONG { color: var(--long); background: color-mix(in srgb, var(--long) 14%, transparent); }
  .SHORT { color: var(--short); background: color-mix(in srgb, var(--short) 14%, transparent); }
  .NEUTRAL { color: var(--neutral); background: color-mix(in srgb, var(--neutral) 12%, transparent); }

  .featured { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 24px; }
  .featured .side { display: grid; gap: 14px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s; }
  .card:hover { border-color: #3a4560; }
  .card .img { background: var(--panel2) center/cover no-repeat; aspect-ratio: 16/8; }
  .side .card .img { aspect-ratio: 16/6; }
  .card .body { padding: 12px 14px 14px; display: grid; gap: 6px; }
  .card h2 { margin: 0; font-size: 20px; line-height: 1.25; }
  .side .card h2 { font-size: 15px; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; }
  .card .badge { position: absolute; top: 10px; left: 10px; backdrop-filter: blur(6px); background: rgba(13,16,22,.8); }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel2); color: #c4cad6; border: 1px solid var(--line); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar h3 { margin: 0 auto 0 0; font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--muted); border: 0; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--panel2); color: var(--text); }
  select, input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; }
  input { width: 160px; }

  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--panel2); }
  .row.fresh { box-shadow: inset 3px 0 0 var(--accent); }
  .row .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .row .title { font-weight: 550; }
  .row .meta { margin-top: 3px; }
  .row .right { display: grid; justify-items: end; gap: 4px; }
  .str { width: 60px; height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .str i { display: block; height: 100%; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 11px; margin-top: 14px; text-align: center; }

  @media (max-width: 760px) {
    .featured { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr auto; }
    .row .time { grid-column: 1 / -1; }
    .mood { grid-template-columns: 1fr; }
    input { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Crypto News <span>Pulse</span></h1>
    <div class="status" id="status">Loading…</div>
  </header>

  <div class="mood" id="mood"></div>

  <section class="featured" id="featured"></section>

  <div class="toolbar">
    <h3>Latest news</h3>
    <div class="seg" id="biasSeg">
      <button data-v="ALL" class="on">All</button>
      <button data-v="LONG">Long</button>
      <button data-v="SHORT">Short</button>
      <button data-v="NEUTRAL">Neutral</button>
    </div>
    <select id="asset"><option value="">All assets</option></select>
    <select id="source"><option value="">All sources</option></select>
    <input id="q" placeholder="Search…">
  </div>
  <div class="list" id="list"></div>
  <div class="note">Sentiment is an automatic keyword read of each headline, not trading advice. Refreshes every 60 s.</div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = { LONG: 'var(--long)', SHORT: 'var(--short)', NEUTRAL: 'var(--neutral)' };
const ARROW = { LONG: '▲', SHORT: '▼', NEUTRAL: '●' };
let data = { items: [], sources: [] }, filter = { bias: 'ALL', asset: '', source: '', q: '' };
const seenLinks = new Set(); let firstLoad = true;

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'now'; if (m < 60) return m + 'm';
  const h = Math.floor(m / 60); return h < 24 ? h + 'h' : Math.floor(h / 24) + 'd';
}
const badge = i => `<span class="badge ${i.bias}">${ARROW[i.bias]} ${i.bias}${i.bias !== 'NEUTRAL' ? ' ' + i.strength + '%' : ''}</span>`;
const chips = i => i.assets.slice(0, 4).map(a => `<span class="chip">${esc(a)}</span>`).join('');

function renderMood() {
  const recent = data.items.filter(i => Date.now() - i.time < 12 * 3600e3);
  const c = { LONG: 0, SHORT: 0, NEUTRAL: 0 };
  recent.forEach(i => c[i.bias]++);
  const n = recent.length || 1, pct = k => (c[k] / n * 100).toFixed(0);
  const net = c.LONG - c.SHORT;
  const label = net > 2 ? ['LONG', 'Leaning bullish'] : net < -2 ? ['SHORT', 'Leaning bearish'] : ['NEUTRAL', 'Mixed'];
  $('#mood').innerHTML = `<b>12h mood: <span class="badge ${label[0]}">${label[1]}</span></b>
    <div class="bar"><i style="width:${pct('LONG')}%;background:var(--long)"></i><i style="width:${pct('NEUTRAL')}%;background:#3b4558"></i><i style="width:${pct('SHORT')}%;background:var(--short)"></i></div>
    <span class="legend">▲ ${c.LONG} long · ● ${c.NEUTRAL} neutral · ▼ ${c.SHORT} short</span>`;
}

function renderFeatured() {
  // Featured: strongest signals from the last 6h (images preferred), fallback to newest.
  const pool = data.items.filter(i => Date.now() - i.time < 6 * 3600e3);
  const ranked = (pool.length >= 3 ? pool : data.items).slice()
    .sort((a, b) => (Math.abs(b.score) + (b.image ? 2 : 0) - b.time / 1e13) - (Math.abs(a.score) + (a.image ? 2 : 0) - a.time / 1e13) || b.time - a.time);
  const top = ranked.slice(0, 3);
  const card = i => `<a class="card" href="${esc(i.link)}" target="_blank" rel="noopener">
      ${badge(i)}<div class="img" style="${i.image ? `background-image:url('${esc(i.image)}')` : ''}"></div>
      <div class="body"><h2>${esc(i.title)}</h2>${i.summary ? `<p>${esc(i.summary.slice(0, 160))}${i.summary.length > 160 ? '…' : ''}</p>` : ''}
      <div class="meta">${esc(i.source)} · ${ago(i.time)} ago ${chips(i)}</div></div></a>`;
  $('#featured').innerHTML = top.length ? card(top[0]) + `<div class="side">${top.slice(1).map(card).join('')}</div>` : '';
}

function renderList() {
  const q = filter.q.toLowerCase();
  const rows = data.items.filter(i =>
    (filter.bias === 'ALL' || i.bias === filter.bias) &&
    (!filter.asset || i.assets.includes(filter.asset)) &&
    (!filter.source || i.source === filter.source) &&
    (!q || (i.title + ' ' + i.summary).toLowerCase().includes(q)));
  $('#list').innerHTML = rows.length ? rows.slice(0, 200).map(i => {
    const fresh = !firstLoad && !seenLinks.has(i.link);
    return `<a class="row${fresh ? ' fresh' : ''}" href="${esc(i.link)}" target="_blank" rel="noopener" title="${esc(i.keywords.join(', '))}">
      <div class="time">${new Date(i.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}<br>${ago(i.time)} ago</div>
      <div><div class="title">${esc(i.title)}</div><div class="meta">${esc(i.source)} ${chips(i)}</div></div>
      <div class="right">${badge(i)}<div class="str"><i style="width:${i.strength}%;background:${COLORS[i.bias]}"></i></div></div></a>`;
  }).join('') : '<div class="empty">No news matches these filters.</div>';
}

function fillSelect(sel, values) {
  const cur = sel.value;
  sel.length = 1;
  values.forEach(v => sel.add(new Option(v, v)));
  sel.value = values.includes(cur) ? cur : '';
}

async function load() {
  try {
    const res = await fetch('/api/news', { cache: 'no-store' });
    data = await res.json();
    const ok = data.sources.filter(s => s.ok).length;
    $('#status').innerHTML = `<span class="dot"></span>${data.items.length} stories · ${ok}/${data.sources.length} sources · updated ${new Date(data.updated).toLocaleTimeString()}`;
    fillSelect($('#asset'), [...new Set(data.items.flatMap(i => i.assets))].sort());
    fillSelect($('#source'), data.sources.filter(s => s.ok).map(s => s.name));
    renderMood(); renderFeatured(); renderList();
    data.items.forEach(i => seenLinks.add(i.link)); firstLoad = false;
  } catch (e) {
    $('#status').textContent = 'Server unreachable, retrying…';
  }
}

$('#biasSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#biasSeg button').forEach(x => x.classList.toggle('on', x === b));
  filter.bias = b.dataset.v; renderList();
};
$('#asset').onchange = e => { filter.asset = e.target.value; renderList(); };
$('#source').onchange = e => { filter.source = e.target.value; renderList(); };
$('#q').oninput = e => { filter.q = e.target.value; renderList(); };

load();
setInterval(load, 60000);
setInterval(() => document.querySelectorAll('.row .time, .card .meta').length && renderList(), 30000);
</script>
</body>
</html>
